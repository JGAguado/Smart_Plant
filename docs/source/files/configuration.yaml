substitutions:
  device_name: "smart-plant"
  friendly_name: "Smart Plant"
  # Display-only fields. Same title contract as NAMING.md; no auto-shortening.
  screen_title: "Lemon tree"
  secondary_name: "Citrus limon"
  # Static plant illustration only. Text and gauges are drawn by ESPHome.
  plant_illustration: "https://raw.githubusercontent.com/JGAguado/Label-maker/85648df6982435ec3ca0dfb3d29630e85afb0fc0/1_Plants/examples/Lemon_tree/Lemon_tree.png"
  illustration_x: "10"
  illustration_y: "37"
  illustration_width: "90"
  illustration_height: "90"
  # Display ranges and illustrative recommendations. Not soil calibration.
  light_max: "3775"
  temp_min: "-10"
  temp_max: "50"
  hum_min: "20"
  hum_max: "80"
  # Care recommendations, independent from scales and physical calibration.
  # Illustrative Lemon defaults match docs/source/files/lemon-tree-label.json.
  # Align HA Plant manually. A change requires rebuilding the firmware.
  soil_recommended_min: "30"
  soil_recommended_max: "60"
  light_recommended_min: "600"
  light_recommended_max: "3775"
  temp_recommended_min: "18"
  temp_recommended_max: "29"
  hum_recommended_min: "20"
  hum_recommended_max: "80"
  # Invert the normal page below this battery percentage. No sleep policy change.
  low_batt_warn_pct: "30"
  project_name: "smart.plant"
  project_version: "2.2"
  ap_pwd: "smartplant"
  # IANA timezone string — find yours at https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
  timezone: "UTC"
  display_busy_gpio: "14"
  display_reset_gpio: "15"
  display_busy_assert_timeout: "2s"
  display_busy_clear_timeout: "30s"
  display_busy_recovery_timeout: "30s"

esphome:
  name: "${device_name}"
  name_add_mac_suffix: true
  project:
    name: "${project_name}"
    version: "${project_version}"
  # Run one bounded boot workflow. It waits briefly for valid time, refreshes the
  # display once, marks the OTA image valid, and enters deep sleep.
  on_boot:
    # Run after sensor setup (600) and display setup (400).
    priority: 399.0
    then:
      - script.execute: consider_deep_sleep


esp32:
  board: esp32-s2-saola-1
  framework:
    type: arduino

# Enable logging
logger:

api:

# Enable MQTT for deep sleep compatibility instead of the api if you preffer to use MQTT 
# mqtt:
#   broker: !secret mqtt_broker
#   discovery: true
#   discovery_retain: true
#   birth_message:
#   will_message:
#   log_topic:

# Enable Over The Air updates
ota:
  - platform: esphome
  
#Public location of this yaml file
dashboard_import:
  package_import_url: github://JGAguado/Smart_Plant/docs/source/files/configuration.yaml@V2R1
  import_full_config: false

# Enable fallback hotspot (captive portal) in case wifi connection fails
captive_portal:

improv_serial:

wifi:
  fast_connect: true
  power_save_mode: none  # Disable WiFi modem sleep for faster reconnection on wake
  ap:
    password: "${ap_pwd}"


i2c:
  scl: GPIO34
  sda: GPIO33
  scan: false
  id: bus_a

spi:
  clk_pin:  GPIO12
  mosi_pin: GPIO11
    
image:
  - platform: file
    file: "${plant_illustration}"
    id: plant_art
    resize: ["${illustration_width}", "${illustration_height}"]
    type: BINARY
    invert_alpha: true

font:
  - file: "gfonts://Audiowide"
    id: font_title
    size: 20
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://Audiowide"
    id: font_subtitle
    size: 15
    glyphsets: [GF_Latin_Core]
  - file: "gfonts://Audiowide"
    id: font_parameters
    size: 15
  - file: 'gfonts://Material+Symbols+Outlined'
    id: font_icon
    size: 20
    glyphs:
      - "\U0000ebdc" # battery empty
      - "\U0000ebd9" # battery 1 bar
      - "\U0000ebe0" # battery 2 bar
      - "\U0000ebdd" # battery 3 bar
      - "\U0000ebe2" # battery 4 bar
      - "\U0000ebd4" # battery 5 bar
      - "\U0000e1a4" # battery full
      - "\U0000e627" # sync

  - file: 'gfonts://Material+Symbols+Outlined'
    id: font_gauge_icon
    size: 22
    # Water, sunlight, temperature and relative humidity; no icon PNGs.
    glyphs: ["\U0000e798", "\U0000e81a", "\U0000e1ff", "\U0000f87e"]

time:
  - platform: sntp
    id: esptime
    timezone: "${timezone}"
    servers:
      - "162.159.200.1"    # Cloudflare NTP (stable anycast IP — no DNS needed)
      - "216.239.35.0"     # Google NTP
      - "pool.ntp.org"     # fallback
switch:
  - platform: gpio
    pin: GPIO4
    id: exc
    icon: "mdi:power"
    restore_mode: ALWAYS_ON
    internal: true  
    
    
sensor:    

  # Battery level sensor    
  - platform: max17043
    id: max17043_id
    battery_voltage:
      id: batvolt      
      name: "${friendly_name} Battery voltage"
      internal: true
      force_update: true
    battery_level:
      id: batpercent
      name: "${friendly_name} Battery"
      force_update: true

  # Temperature and humidity sensor
  - platform: aht10
    variant: AHT20 
    i2c_id: bus_a
    temperature:
      name: "${friendly_name} Temperature"
      id: temp
      icon: "mdi:thermometer"
      device_class: temperature
      force_update: true
    humidity:
      name: "${friendly_name} Air Humidity"
      id: hum
      icon: "mdi:water-percent"
      device_class: humidity
      force_update: true
    update_interval: 3s

  # Light sensor
  - platform: veml7700
    address: 0x10
    update_interval: 3s
    ambient_light: 
      name: "${friendly_name} Ambient light"
      id: light
      icon: "mdi:white-balance-sunny"
      device_class: illuminance
      force_update: true
    actual_gain:
      name: "Actual gain"
      internal: true
        
  # Capacitive soil moisture sensor
  - platform: adc
    pin: GPIO1
    name: "${friendly_name} Soil Moisture"
    id : soil
    # In order to have proper mapping in HA
    device_class: moisture
    icon: "mdi:cup-water"
    update_interval: 3s
    unit_of_measurement: "%"
    attenuation: 12db
    force_update: true
    filters:
    - median:
        window_size: 5
        send_every: 5

    - calibrate_linear:
        - 1.25 -> 100.00
        - 2.8 -> 0.00
    - lambda: if (x < 1) return 0; else if (x > 100) return 100; return (x);
    accuracy_decimals: 0

display:
  - platform: waveshare_epaper
    cs_pin: GPIO10
    dc_pin: GPIO13
    busy_pin: GPIO${display_busy_gpio}
    reset_pin: GPIO${display_reset_gpio}
    rotation: 270
    model: 2.90inv2
    id: my_display
    update_interval: never
    full_update_every: 1
    pages: 
      - id: page1
        lambda: |-
          bool battery_valid = id(batpercent).has_state() && std::isfinite(id(batpercent).state);
          const bool warning = battery_valid && id(batpercent).state < ${low_batt_warn_pct};
          const auto fg = warning ? COLOR_OFF : COLOR_ON;
          const auto bg = warning ? COLOR_ON : COLOR_OFF;
          it.fill(bg);
          it.image(${illustration_x}, ${illustration_y}, id(plant_art), fg, bg);

          // Screen-only title. The image contains only the plant illustration.
          // Top-left, above the illustration and clear of the gauges; a rename
          // touches only these substitutions, no image regeneration.
          it.printf(2, 0,  id(font_title),    fg, TextAlign::TOP_LEFT, "%s", "${screen_title}");
          it.printf(2, 22, id(font_subtitle), fg, TextAlign::TOP_LEFT, "%s", "${secondary_name}");
          if (battery_valid) {
            float battery_perc = id(batpercent).state;
            const float icon_percent = std::fmin(100.0f, std::fmax(0.0f, battery_perc));
            const int battery_range = static_cast<int>(icon_percent / 16.0f);
            const char* battery_icon_map[] = {
              "\U0000ebdc", "\U0000ebd9", "\U0000ebe0", "\U0000ebdd",
              "\U0000ebe2", "\U0000ebd4", "\U0000e1a4"
            };
            it.printf(278, 1, id(font_icon), fg, TextAlign::TOP_LEFT, battery_icon_map[battery_range]);
            it.printf(278, 1, id(font_subtitle), fg, TextAlign::TOP_RIGHT, "%3.0f%%", battery_perc);
          } else {
            it.printf(278, 1, id(font_subtitle), fg, TextAlign::TOP_RIGHT, " --%%");
          }

          auto now = id(esptime).now();
          if (now.is_valid()) {
            it.strftime(278, 18, id(font_subtitle), fg, TextAlign::TOP_RIGHT, "%H:%M %d/%m", now);
          } else {
            it.printf(278, 18, id(font_subtitle), fg, TextAlign::TOP_RIGHT, "--:-- --/--");
          }
          it.printf(278, 18, id(font_icon), fg, TextAlign::TOP_LEFT, "\U0000e627");

          // Preserve the legacy midpoint-filled annulus, not a min-to-max band.
          // Keep local lambdas so the standalone YAML needs no C++ include file.
          auto draw_ring = [&](float vmin, float vmax, float recommended_min,
                               float recommended_max, int xc, int yc, const char *icon) {
            const float ring_pi = 3.141592653589793f;
            const float sweep = 4.71238898038469f;
            const float start = ring_pi / 2 + (2 * ring_pi - sweep) / 2;
            const float midpoint = recommended_min / 2 + recommended_max / 2;
            const float endpoint = start + (midpoint - vmin) / (vmax - vmin) * sweep;
            for (int y = -23; y <= 22; ++y) {
              for (int x = -23; x <= 22; ++x) {
                const float dx = x + 0.5f, dy = y + 0.5f;
                const float squared = dx * dx + dy * dy;
                if (squared < 16.5f * 16.5f || squared > 22.5f * 22.5f) continue;
                float angle = std::atan2(dy, dx);
                if (angle < start) angle += 2 * ring_pi;
                const bool in_sweep = angle <= start + sweep;
                const bool fill = squared >= 17 * 17 && squared <= 22 * 22 && angle <= endpoint;
                const bool outline = squared <= 17.5f * 17.5f || squared >= 21.5f * 21.5f;
                if (in_sweep && (fill || outline)) it.draw_pixel_at(xc + 22 + x, yc + 22 + y, fg);
              }
            }
            for (float a : {start, start + sweep}) {
              it.line(static_cast<int>(std::round(xc + 22 + 17 * std::cos(a))),
                      static_cast<int>(std::round(yc + 22 + 17 * std::sin(a))),
                      static_cast<int>(std::round(xc + 22 + 22 * std::cos(a))),
                      static_cast<int>(std::round(yc + 22 + 22 * std::sin(a))), fg);
            }
            it.printf(xc + 22, yc + 11, id(font_gauge_icon), fg, TextAlign::TOP_CENTER, "%s", icon);
          };
          static_assert(0 < 100 && 0 <= ${soil_recommended_min} &&
                        ${soil_recommended_min} <= ${soil_recommended_max} &&
                        ${soil_recommended_max} <= 100, "Invalid soil display range");
          draw_ring(0, 100, ${soil_recommended_min}, ${soil_recommended_max}, 80, 50, "\U0000e798");
          static_assert(0 < ${light_max} && 0 <= ${light_recommended_min} &&
                        ${light_recommended_min} <= ${light_recommended_max} &&
                        ${light_recommended_max} <= ${light_max}, "Invalid light display range");
          draw_ring(0, ${light_max}, ${light_recommended_min}, ${light_recommended_max}, 134, 70, "\U0000e81a");
          static_assert(${temp_min} < ${temp_max} && ${temp_min} <= ${temp_recommended_min} &&
                        ${temp_recommended_min} <= ${temp_recommended_max} &&
                        ${temp_recommended_max} <= ${temp_max}, "Invalid temp display range");
          draw_ring(${temp_min}, ${temp_max}, ${temp_recommended_min}, ${temp_recommended_max}, 188, 50, "\U0000e1ff");
          static_assert(${hum_min} < ${hum_max} && ${hum_min} <= ${hum_recommended_min} &&
                        ${hum_recommended_min} <= ${hum_recommended_max} &&
                        ${hum_recommended_max} <= ${hum_max}, "Invalid hum display range");
          draw_ring(${hum_min}, ${hum_max}, ${hum_recommended_min}, ${hum_recommended_max}, 242, 70, "\U0000f87e");

          float pi = 3.141592653589793;
          float alpha = 4.71238898038469;
          float beta = 2*pi - alpha;
          int radius = 22;
          int thick = 7;

          auto draw_gauge = [&](float value, bool valid, float vmin, float vmax, int xc, int yc, const char* fmt) {
            if (!valid || !std::isfinite(value)) {
              it.printf(xc + radius, yc + 1.7*radius, id(font_parameters), fg, TextAlign::TOP_CENTER, "--");
              return;
            }
            // Keep the measured number; clamp only the needle coordinates.
            float needle_value = value;
            if (needle_value < vmin) needle_value = vmin;
            if (needle_value > vmax) needle_value = vmax;
            float val = (needle_value - vmin) / abs(vmax - vmin) * alpha;
            int x0 = static_cast<int>(xc + radius + radius * cos(pi / 2 + beta / 2 + val));
            int y0 = static_cast<int>(yc + radius + radius * sin(pi / 2 + beta / 2 + val));
            int x1 = static_cast<int>(xc + radius + (radius+thick) * cos(pi / 2 + beta / 2 + val + 0.1));
            int y1 = static_cast<int>(yc + radius + (radius+thick) * sin(pi / 2 + beta / 2 + val + 0.1));
            int x2 = static_cast<int>(xc + radius + (radius+thick) * cos(pi / 2 + beta / 2 + val - 0.1));
            int y2 = static_cast<int>(yc + radius + (radius+thick) * sin(pi / 2 + beta / 2 + val - 0.1));
            it.line(x0, y0, x1, y1, fg);
            it.line(x1, y1, x2, y2, fg);
            it.line(x2, y2, x0, y0, fg);
            it.printf(xc + radius, yc + 1.7*radius, id(font_parameters), fg, TextAlign::TOP_CENTER, fmt, value);
          };

          draw_gauge(id(soil).state,  id(soil).has_state(),  0,           100,          80,  50, "%.0f%%");
          draw_gauge(id(light).state, id(light).has_state(), 0,           ${light_max}, 134, 70, "%.0flx");
          draw_gauge(id(temp).state,  id(temp).has_state(),  ${temp_min}, ${temp_max},  188, 50, "%.0f°C");
          draw_gauge(id(hum).state,   id(hum).has_state(),   ${hum_min},  ${hum_max},   242, 70, "%.0f%%");

deep_sleep:
  id: deep_sleep_control
  # run_duration: 5s
  sleep_duration: 1h

globals:
  - id: display_busy_seen
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: display_settle_ok
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: display_safe_to_sleep
    type: bool
    restore_value: false
    initial_value: 'true'
  - id: display_reset_pending
    type: bool
    restore_value: false
    initial_value: 'false'

script:
  - id: consider_deep_sleep
    mode: single
    then:
      - wait_until:
          condition:
            lambda: 'return id(esptime).now().is_valid();'
          timeout: 10s
      - script.execute: prepare_display_refresh
      - component.update: my_display
      - script.execute: settle_display
      - script.wait: settle_display
      - script.execute: sleep_after_display

  - id: prepare_display_refresh
    then:
      # Run before any new display SPI writes. A new refresh invalidates any
      # delayed recovery from an older one.
      - script.stop: settle_display
      - script.stop: recover_display_busy
      - script.stop: display_recovery_budget
      - script.stop: enter_deep_sleep
      - script.stop: sleep_after_display
      - script.stop: handle_display_busy_fault
      - script.stop: force_sleep_after_busy_fault
      - lambda: |-
          // Cancellation during the asynchronous reset pulse must release RST.
          if (id(display_reset_pending)) {
            digitalWrite(${display_reset_gpio}, HIGH);
            id(display_reset_pending) = false;
          }
          id(display_settle_ok) = false;
          id(display_busy_seen) = false;
          id(display_safe_to_sleep) = false;

  - id: settle_display
    mode: restart
    then:
      - delay: 100ms
      - wait_until:
          condition:
            lambda: 'return digitalRead(${display_busy_gpio}) == HIGH;'
          timeout: ${display_busy_assert_timeout}
      - if:
          condition:
            lambda: 'return digitalRead(${display_busy_gpio}) == HIGH;'
          then:
            - lambda: 'id(display_busy_seen) = true;'
            - wait_until:
                condition:
                  lambda: 'return digitalRead(${display_busy_gpio}) == LOW;'
                timeout: ${display_busy_clear_timeout}
      - lambda: |-
          const bool busy_low = digitalRead(${display_busy_gpio}) == LOW;
          id(display_safe_to_sleep) = busy_low;
          id(display_settle_ok) = id(display_busy_seen) && busy_low;
      - if:
          condition:
            lambda: 'return id(display_settle_ok);'
          then:
            - delay: 500ms
          else:
            - logger.log:
                level: ERROR
                format: "E-paper refresh not confirmed (asserted=%s, safe_low=%s)"
                args:
                  - 'id(display_busy_seen) ? "true" : "false"'
                  - 'id(display_safe_to_sleep) ? "true" : "false"'

  - id: recover_display_busy
    mode: restart
    then:
      # A separate single-mode timer survives LOW/HIGH retries and the final
      # 1s sleep delay. Only a new refresh or successful sleep cancels it.
      - if:
          condition:
            not:
              script.is_running: display_recovery_budget
          then:
            - script.execute: display_recovery_budget
      - wait_until:
          condition:
            lambda: 'return digitalRead(${display_busy_gpio}) == LOW;'
          timeout: ${display_busy_recovery_timeout}
      - delay: 500ms
      - if:
          condition:
            lambda: 'return digitalRead(${display_busy_gpio}) == LOW;'
          then:
            - lambda: 'id(display_safe_to_sleep) = true;'
            - logger.log:
                level: WARN
                format: "E-paper BUSY cleared after recovery window; resuming safe sleep"
            - script.execute: enter_deep_sleep
          else:
            - script.execute: handle_display_busy_fault

  # With the default 30s budget, reset and sleep request take at most
  # 30.510s plus event-loop latency. This ends at deep_sleep.enter; native
  # shutdown hooks can still send the final display SPI sleep command.
  - id: display_recovery_budget
    mode: single
    then:
      - delay: ${display_busy_recovery_timeout}
      - script.execute: handle_display_busy_fault

  # Shared terminal path for a failed guard or the total budget. Stop pending
  # normal sleep/recovery before reset. No display/SPI action occurs here.
  - id: handle_display_busy_fault
    mode: single
    then:
      - script.stop: display_recovery_budget
      - script.stop: recover_display_busy
      - script.stop: enter_deep_sleep
      - script.stop: sleep_after_display
      - lambda: |-
          id(display_safe_to_sleep) = false;
      - logger.log:
          level: ERROR
          format: "E-paper BUSY recovery failed or budget exhausted; reset then emergency sleep"
      - lambda: |-
          pinMode(${display_reset_gpio}, OUTPUT);
          id(display_reset_pending) = true;
          digitalWrite(${display_reset_gpio}, LOW);
      - delay: 10ms
      - lambda: |-
          digitalWrite(${display_reset_gpio}, HIGH);
          id(display_reset_pending) = false;
      - delay: 500ms
      - script.execute: force_sleep_after_busy_fault

  # No new display refresh follows a terminal fault. Native shutdown hooks
  # remain enabled, including the stock driver's final SPI sleep command.
  - id: force_sleep_after_busy_fault
    then:
      # Keep this safeguard for users on arbitrary ESPHome versions.
      - safe_mode.mark_successful
      - deep_sleep.allow: deep_sleep_control
      - switch.turn_off: exc
      - deep_sleep.enter: deep_sleep_control

  - id: sleep_after_display
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(display_safe_to_sleep);'
          then:
            - script.execute: enter_deep_sleep
          else:
            - deep_sleep.prevent: deep_sleep_control
            - script.execute: recover_display_busy

  - id: enter_deep_sleep
    mode: restart
    then:
      - delay: 1s
      - if:
          condition:
            lambda: |-
              return id(display_safe_to_sleep) &&
                     digitalRead(${display_busy_gpio}) == LOW;
          then:
            - script.stop: display_recovery_budget
            # Preserve version-independent OTA validation on normal sleep too.
            - safe_mode.mark_successful
            - deep_sleep.allow: deep_sleep_control
            - switch.turn_off: exc
            # MAX17048 stays powered from VBAT and hibernates automatically.
            - deep_sleep.enter: deep_sleep_control
          else:
            - lambda: 'id(display_safe_to_sleep) = false;'
            - script.execute: sleep_after_display
