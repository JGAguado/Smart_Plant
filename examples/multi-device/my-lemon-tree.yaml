# =============================================================================
# My Lemon Tree — device-specific config
# =============================================================================
# Only define what's specific to this device. Everything else comes from the
# core package and MQTT profile (sensors, display, deep sleep, fonts, transport).
# =============================================================================

substitutions:
  # Immutable technical identity. Never rename an installed device or its MQTT
  # prefix merely to improve a visible label.
  device_name: "lemon-tree"
  configured_name: "lemon-tree"
  name_add_mac_suffix: "true"

  # Human and botanical identity. display_name is the single human source: the
  # core package feeds it to esphome.friendly_name, device_comment and every
  # e-paper text page. secondary_name is the botanical/cultivar label. Entities
  # are function-only, so neither name enters an entity's MQTT unique_id and
  # either can change without a Home Assistant registry migration.
  # Production fleet devices instead import a generated, identity-preserving
  # metadata package (configured_name=<device_name>-<mac6>, name_add_mac_suffix:
  # false) from packages/generated/ — see scripts/generate_device_metadata.py.
  display_name: "Lemon Tree"
  secondary_name: "Citrus × limon"

  # Use secret references for new installations. Existing live credentials do
  # not need to be migrated solely to follow this example.
  ota_password: !secret lemon_tree_ota_password

  # Plant label image (place PNG in esphome/plant_labels/)
  label_image: "plant_labels/Lemon_tree_label_page_1.png"

  timezone: "Europe/Paris"

  # Soil calibration — measure your specific sensor in dry air and submerged
  soil_v_wet: "1.25"
  soil_v_dry: "2.8"

  # Lemon trees tolerate more light than average
  light_max: "8000"

packages:
  core:      github://flowcool/Smart_Plant/examples/multi-device/packages/smart_plant_core.yaml@V2R1
  transport: github://flowcool/Smart_Plant/examples/multi-device/packages/smart_plant_profile_mqtt.yaml@V2R1

# Static IP — merges on top of the core wifi block. Remove this block for DHCP.
wifi:
  manual_ip:
    static_ip: 192.168.1.100
    gateway: 192.168.1.1
    subnet: 255.255.255.0
