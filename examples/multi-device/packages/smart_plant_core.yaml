# =============================================================================
# Smart Plant — transport-independent core package
# =============================================================================
# Compose this package with exactly one transport profile:
#
#   packages:
#     core: github://flowcool/Smart_Plant/examples/multi-device/packages/smart_plant_core.yaml@V2R1
#     transport: github://flowcool/Smart_Plant/examples/multi-device/packages/smart_plant_profile_mqtt.yaml@V2R1
#
# This file owns hardware, sensors, display, Wi-Fi and the sleep decision only.
# Transport setup and boot orchestration belong to the selected profile.
# =============================================================================

# Default values — override any of these in your device file.
substitutions:
  device_name: "smart-plant"
  friendly_name: "Smart Plant"
  device_comment: "${friendly_name}"
  project_name: "smart.plant"
  project_version: "2.2"
  ap_ssid: "Smart-Plant"
  ap_pwd: "smartplant"
  timezone: "Europe/Paris"

  # OTA password (leave empty string for no password)
  ota_password: ""

  # Wi-Fi credentials — overridden per-device via !secret in the local
  # device file. Must stay plain substitutions here (no !secret): this file
  # is fetched as a remote package, and the remote-build bundler refuses to
  # ship secrets.yaml to packages pulled from a github:// source.
  wifi_ssid: ""
  wifi_password: ""
  # Address used by ESPHome CLI/dashboard for OTA and log connections.
  # Default: device hostname via mDNS. Set to static IP for reliability.
  use_address: "${device_name}"

  # Background image for the e-paper display — local path or URL
  label_image: "https://smart-plant.readthedocs.io/en/v2r1/_images/Lemon_tree_label_page_1.png"

  # Soil moisture calibration (ADC voltage → %)
  soil_v_wet: "1.25"   # voltage when sensor is fully submerged
  soil_v_dry: "2.8"    # voltage in dry air

  # Gauge display ranges
  light_max: "3775"
  temp_min: "-10"
  temp_max: "50"
  hum_min: "20"
  hum_max: "80"

  # The legacy Waveshare driver returns before the active-high BUSY signal has
  # completed every physical refresh. These bounded windows prevent sleep from
  # cutting power while the panel is still updating.
  display_busy_gpio: "14"
  display_reset_gpio: "15"
  display_busy_assert_timeout: "2s"
  display_busy_clear_timeout: "30s"
  display_busy_recovery_timeout: "30s"

globals:
  - id: display_busy_seen
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: display_settle_ok
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: display_reset_pending
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: display_safe_to_sleep
    type: bool
    restore_value: false
    initial_value: 'true'

esphome:
  name: "${device_name}"
  name_add_mac_suffix: true
  comment: "${device_comment}"
  project:
    name: "${project_name}"
    version: "${project_version}"

esp32:
  board: esp32-s2-saola-1
  framework:
    type: arduino
  cpu_frequency: 160MHz

logger:
  level: WARN

captive_portal:
improv_serial:

wifi:
  ssid: "${wifi_ssid}"
  password: "${wifi_password}"
  fast_connect: true
  # none (au lieu de LIGHT) : le modem wifi reste éveillé et répond aux requêtes
  # mDNS multicast en continu → le dashboard garde mac/config_hash/version frais
  # (sinon le device n'annonce le mDNS qu'à son boot). Coût = un peu plus de conso.
  power_save_mode: none
  use_address: "${use_address}"
  ap:
    ssid: "${ap_ssid}"
    password: "${ap_pwd}"

i2c:
  scl: GPIO34
  sda: GPIO33
  scan: false
  id: bus_a

spi:
  clk_pin:  GPIO12
  mosi_pin: GPIO11

image:
  - platform: file
    file: "${label_image}"
    id: page_1_background
    type: BINARY
    invert_alpha: true

font:
  - file: "gfonts://Audiowide"
    id: font_title
    size: 20
  - file: "gfonts://Audiowide"
    id: font_subtitle
    size: 15
  - file: "gfonts://Audiowide"
    id: font_parameters
    size: 15
  - file: 'gfonts://Material+Symbols+Outlined'
    id: font_icon
    size: 20
    glyphs:
      - "\U0000ebdc"
      - "\U0000ebd9"
      - "\U0000ebe0"
      - "\U0000ebdd"
      - "\U0000ebe2"
      - "\U0000ebd4"
      - "\U0000e1a4"
      - "\U0000e627"

time:
  - platform: sntp
    id: esptime
    timezone: "${timezone}"
    servers:
      - "162.159.200.1"    # Cloudflare NTP (anycast, IP stable)
      - "216.239.35.0"     # Google NTP
      - "pool.ntp.org"

switch:
  - platform: gpio
    pin: GPIO4
    id: exc
    icon: "mdi:power"
    restore_mode: ALWAYS_ON
    internal: true

sensor:
  - platform: max17043
    id: max17043_id
    update_interval: never
    battery_voltage:
      id: batvolt
      name: "${friendly_name} Battery voltage"
      internal: true
    battery_level:
      id: batpercent
      device_class: "battery"
      unit_of_measurement: "%"
      name: "${friendly_name} Battery"
      force_update: true

  - platform: aht10
    id: aht20_sensor
    variant: AHT20
    i2c_id: bus_a
    temperature:
      name: "${friendly_name} Temperature"
      id: temp
      icon: "mdi:thermometer"
      device_class: temperature
      force_update: true
    humidity:
      name: "${friendly_name} Air Humidity"
      id: hum
      icon: "mdi:water-percent"
      device_class: humidity
      force_update: true
    update_interval: never

  - platform: veml7700
    id: veml7700_sensor
    address: 0x10
    update_interval: never
    ambient_light:
      name: "${friendly_name} Ambient light"
      id: light
      icon: "mdi:white-balance-sunny"
      device_class: illuminance
      force_update: true
    actual_gain:
      name: "${friendly_name} Actual gain"
      internal: true

  - platform: adc
    pin: GPIO1
    name: "${friendly_name} Soil Voltage"
    id: soil_voltage
    device_class: voltage
    state_class: measurement
    entity_category: diagnostic
    update_interval: never
    unit_of_measurement: "V"
    attenuation: 12db
    force_update: true
    filters:
      - median:
          window_size: 5
          send_every: 5
          send_first_at: 5
      # Reject disconnected/shorted readings before applying the percentage
      # calibration. An invalid voltage therefore remains unavailable instead
      # of becoming a plausible-looking 0% or 100% value.
      - clamp:
          min_value: 0.5
          max_value: 3.3
          ignore_out_of_range: true
    accuracy_decimals: 3

  # Derive moisture from the single filtered ADC publication, without a second
  # sampling loop or an intermediate unfiltered percentage.
  - platform: copy
    source_id: soil_voltage
    name: "${friendly_name} Soil Moisture"
    id: soil
    icon: "mdi:cup-water"
    device_class: moisture
    unit_of_measurement: "%"
    force_update: true
    filters:
      - calibrate_linear:
          - ${soil_v_wet} -> 100.00
          - ${soil_v_dry} -> 0.00
      - lambda: if (x < 1) return 0; else if (x > 100) return 100; return (x);
    accuracy_decimals: 0

# Publish the running firmware version and native effective-configuration hash.
text_sensor:
  - platform: version
    name: "${friendly_name} ESPHome Version"
    hide_timestamp: true
    hide_hash: false
    entity_category: diagnostic

display:
  - platform: waveshare_epaper
    cs_pin: GPIO10
    dc_pin: GPIO13
    busy_pin: GPIO${display_busy_gpio}
    reset_pin: GPIO${display_reset_gpio}
    rotation: 270
    model: 2.90inv2
    id: my_display
    update_interval: never
    full_update_every: 1
    pages:
      - id: page1
        lambda: |-
          it.image(0, 0, id(page_1_background));

          bool battery_valid = id(batpercent).has_state() && std::isfinite(id(batpercent).state);
          if (battery_valid) {
            float battery_perc = id(batpercent).state;
            int battery_range = static_cast<int>(battery_perc / 16.0f);
            battery_range = (battery_range > 6) ? 6 : battery_range;
            battery_range = (battery_range < 0)  ? 0 : battery_range;
            const char* battery_icon_map[] = {
              "\U0000ebdc", "\U0000ebd9", "\U0000ebe0", "\U0000ebdd",
              "\U0000ebe2", "\U0000ebd4", "\U0000e1a4"
            };
            it.printf(278, 1, id(font_icon), TextAlign::TOP_LEFT, battery_icon_map[battery_range]);
            it.printf(278, 1, id(font_subtitle), TextAlign::TOP_RIGHT, "%3.0f%%", battery_perc);
          } else {
            it.printf(278, 1, id(font_subtitle), TextAlign::TOP_RIGHT, " --%%");
          }

          auto now = id(esptime).now();
          if (now.is_valid()) {
            it.strftime(278, 18, id(font_subtitle), TextAlign::TOP_RIGHT, "%H:%M %d/%m", now);
          } else {
            it.printf(278, 18, id(font_subtitle), TextAlign::TOP_RIGHT, "--:-- --/--");
          }
          it.printf(278, 18, id(font_icon), TextAlign::TOP_LEFT, "\U0000e627");

          float pi = 3.141592653589793;
          float alpha = 4.71238898038469;
          float beta = 2*pi - alpha;
          int radius = 22;
          int thick = 7;

          auto draw_gauge = [&](float value, bool valid, float vmin, float vmax, int xc, int yc, const char* fmt) {
            if (!valid || !std::isfinite(value)) {
              it.printf(xc + radius, yc + 1.7*radius, id(font_parameters), TextAlign::TOP_CENTER, "--");
              return;
            }
            // Keep the measured number; clamp only the needle coordinates.
            float needle_value = value;
            if (needle_value < vmin) needle_value = vmin;
            if (needle_value > vmax) needle_value = vmax;
            float val = (needle_value - vmin) / abs(vmax - vmin) * alpha;
            int x0 = static_cast<int>(xc + radius + radius * cos(pi / 2 + beta / 2 + val));
            int y0 = static_cast<int>(yc + radius + radius * sin(pi / 2 + beta / 2 + val));
            int x1 = static_cast<int>(xc + radius + (radius+thick) * cos(pi / 2 + beta / 2 + val + 0.1));
            int y1 = static_cast<int>(yc + radius + (radius+thick) * sin(pi / 2 + beta / 2 + val + 0.1));
            int x2 = static_cast<int>(xc + radius + (radius+thick) * cos(pi / 2 + beta / 2 + val - 0.1));
            int y2 = static_cast<int>(yc + radius + (radius+thick) * sin(pi / 2 + beta / 2 + val - 0.1));
            it.line(x0, y0, x1, y1);
            it.line(x1, y1, x2, y2);
            it.line(x2, y2, x0, y0);
            it.printf(xc + radius, yc + 1.7*radius, id(font_parameters), TextAlign::TOP_CENTER, fmt, value);
          };

          draw_gauge(id(soil).state,  id(soil).has_state(),  0,           100,          80,  50, "%.0f%%");
          draw_gauge(id(light).state, id(light).has_state(), 0,           ${light_max}, 134, 70, "%.0flx");
          draw_gauge(id(temp).state,  id(temp).has_state(),  ${temp_min}, ${temp_max},  188, 50, "%.0f°C");
          draw_gauge(id(hum).state,   id(hum).has_state(),   ${hum_min},  ${hum_max},   242, 70, "%.0f%%");

deep_sleep:
  id: deep_sleep_control
  sleep_duration: 1h

script:
  # Each sensor is triggered only as often as its own conversion/filter needs.
  # All waits are bounded, so a failed sensor cannot keep the device awake.
  - id: acquire_normal
    mode: restart
    then:
      - switch.turn_on: exc
      - component.update: max17043_id
      - wait_until:
          condition:
            lambda: 'return id(batpercent).has_state() && std::isfinite(id(batpercent).state);'
          timeout: 3s
      - component.update: aht20_sensor
      - component.update: veml7700_sensor
      - wait_until:
          condition:
            lambda: |-
              return id(temp).has_state() && std::isfinite(id(temp).state) &&
                     id(hum).has_state() && std::isfinite(id(hum).state);
          timeout: 3s
      - wait_until:
          condition:
            lambda: 'return id(light).has_state() && std::isfinite(id(light).state);'
          timeout: 5s
      - repeat:
          count: 5
          then:
            - component.update: soil_voltage
            - delay: 3s
      - wait_until:
          condition:
            lambda: 'return id(soil).has_state() && std::isfinite(id(soil).state);'
          timeout: 3s
      - wait_until:
          condition:
            lambda: 'return id(esptime).now().is_valid();'
          timeout: 10s
      - script.execute: render_and_sleep

  - id: render_and_sleep
    mode: restart
    then:
      - display.page.show: page1
      - script.execute: prepare_display_refresh
      - component.update: my_display
      - script.execute: settle_display
      - script.wait: settle_display
      - if:
          condition:
            lambda: 'return id(display_safe_to_sleep);'
          then:
            - script.execute: enter_deep_sleep
          else:
            - deep_sleep.prevent: deep_sleep_control
            - script.execute: recover_display_busy

  - id: prepare_display_refresh
    then:
      # Run before any new display SPI writes. A new refresh invalidates any
      # delayed recovery from an older one.
      - script.stop: settle_display
      - script.stop: recover_display_busy
      - script.stop: display_recovery_budget
      - script.stop: enter_deep_sleep
      - script.stop: sleep_after_display
      - script.stop: handle_display_busy_fault
      - script.stop: force_sleep_after_busy_fault
      - lambda: |-
          // Cancellation during the asynchronous reset pulse must release RST.
          if (id(display_reset_pending)) {
            digitalWrite(${display_reset_gpio}, HIGH);
            id(display_reset_pending) = false;
          }
          id(display_settle_ok) = false;
          id(display_busy_seen) = false;
          id(display_safe_to_sleep) = false;

  - id: settle_display
    mode: restart
    then:
      - delay: 100ms
      - wait_until:
          condition:
            lambda: 'return digitalRead(${display_busy_gpio}) == HIGH;'
          timeout: ${display_busy_assert_timeout}
      - if:
          condition:
            lambda: 'return digitalRead(${display_busy_gpio}) == HIGH;'
          then:
            - lambda: 'id(display_busy_seen) = true;'
            - wait_until:
                condition:
                  lambda: 'return digitalRead(${display_busy_gpio}) == LOW;'
                timeout: ${display_busy_clear_timeout}
      - lambda: |-
          const bool busy_low = digitalRead(${display_busy_gpio}) == LOW;
          id(display_safe_to_sleep) = busy_low;
          id(display_settle_ok) = id(display_busy_seen) && busy_low;
      - if:
          condition:
            lambda: 'return id(display_settle_ok);'
          then:
            - delay: 500ms
          else:
            - logger.log:
                level: ERROR
                format: "E-paper refresh not confirmed (asserted=%s, safe_low=%s)"
                args:
                  - 'id(display_busy_seen) ? "true" : "false"'
                  - 'id(display_safe_to_sleep) ? "true" : "false"'

  - id: recover_display_busy
    mode: restart
    then:
      # A separate single-mode timer survives LOW/HIGH retries and the final
      # 1s sleep delay. Only a new refresh or successful sleep cancels it.
      - if:
          condition:
            not:
              script.is_running: display_recovery_budget
          then:
            - script.execute: display_recovery_budget
      - wait_until:
          condition:
            lambda: 'return digitalRead(${display_busy_gpio}) == LOW;'
          timeout: ${display_busy_recovery_timeout}
      - delay: 500ms
      - if:
          condition:
            lambda: 'return digitalRead(${display_busy_gpio}) == LOW;'
          then:
            - lambda: 'id(display_safe_to_sleep) = true;'
            - logger.log:
                level: WARN
                format: "E-paper BUSY cleared after recovery window; resuming safe sleep"
            - script.execute: enter_deep_sleep
          else:
            - script.execute: handle_display_busy_fault

  # With the default 30s budget, reset and sleep request take at most
  # 30.510s plus event-loop latency. This ends at deep_sleep.enter; native
  # shutdown hooks can still send the final display SPI sleep command.
  - id: display_recovery_budget
    mode: single
    then:
      - delay: ${display_busy_recovery_timeout}
      - script.execute: handle_display_busy_fault

  # Shared terminal path for a failed guard or the total budget. Stop pending
  # normal sleep/recovery before reset. No display/SPI action occurs here.
  - id: handle_display_busy_fault
    mode: single
    then:
      - script.stop: display_recovery_budget
      - script.stop: recover_display_busy
      - script.stop: enter_deep_sleep
      - script.stop: sleep_after_display
      - lambda: |-
          id(display_safe_to_sleep) = false;
      - logger.log:
          level: ERROR
          format: "E-paper BUSY recovery failed or budget exhausted; reset then emergency sleep"
      - lambda: |-
          pinMode(${display_reset_gpio}, OUTPUT);
          id(display_reset_pending) = true;
          digitalWrite(${display_reset_gpio}, LOW);
      - delay: 10ms
      - lambda: |-
          digitalWrite(${display_reset_gpio}, HIGH);
          id(display_reset_pending) = false;
      - delay: 500ms
      - script.execute: force_sleep_after_busy_fault

  # No new display refresh follows a terminal fault. Native shutdown hooks
  # remain enabled, including the stock driver's final SPI sleep command.
  - id: force_sleep_after_busy_fault
    then:
      # Keep this safeguard for standalone users on arbitrary ESPHome versions.
      - safe_mode.mark_successful
      - deep_sleep.allow: deep_sleep_control
      - switch.turn_off: exc
      - deep_sleep.enter: deep_sleep_control

  - id: sleep_after_display
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(display_safe_to_sleep);'
          then:
            - script.execute: enter_deep_sleep
          else:
            - deep_sleep.prevent: deep_sleep_control
            - script.execute: recover_display_busy

  - id: enter_deep_sleep
    mode: restart
    then:
      - delay: 1s
      - if:
          condition:
            lambda: |-
              return id(display_safe_to_sleep) &&
                     digitalRead(${display_busy_gpio}) == LOW;
          then:
            - script.stop: display_recovery_budget
            # Preserve version-independent OTA validation on normal sleep too.
            - safe_mode.mark_successful
            - deep_sleep.allow: deep_sleep_control
            - switch.turn_off: exc
            # MAX17048 stays powered from VBAT and hibernates automatically.
            - deep_sleep.enter: deep_sleep_control
          else:
            - lambda: 'id(display_safe_to_sleep) = false;'
            - script.execute: sleep_after_display
