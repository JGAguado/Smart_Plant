# =============================================================================
# Smart Plant — native-API transport profile
# =============================================================================
# Compose with smart_plant_core.yaml. This is the simpler Home Assistant path,
# but entities become unavailable between wake cycles because API state is not
# retained. The profile has no broker dependency.
# =============================================================================

esphome:
  on_boot:
    # GPIO switches initialize at priority 800 and sensors at 600. Settle the
    # switched I2C rail between those phases, then acquire after the display
    # (priority 400) has finished setup.
    - priority: 700
      then:
        - lambda: 'delay(250);'
    - priority: 399.0
      then:
        # Storage belongs to MQTT. Clear a latch restored from an older profile.
        - lambda: 'id(storage_active) = false;'
        - script.execute: acquire_normal

api:
  encryption:
    key: "${api_encryption_key}"

ota:
  - platform: esphome
    password: "${ota_password}"

script:
  - id: on_display_fault
    then:
      - logger.log:
          level: ERROR
          format: "Display BUSY permanent fault #%d — emergency sleep"
          args:
            - 'id(display_busy_fault_count)'
      - delay: 500ms

  # Simple sleep decision: no maintenance/storage. acquire_normal (core) ends by
  # calling this; render the measurement page and sleep.

  - id: decide_sleep
    mode: restart
    then:
      - script.execute: render_measurement_page
      - script.wait: render_measurement_page
      - script.execute: sleep_after_display

  # API variant of sleep_after_display: same BUSY-safety logic as the MQTT
  # profile, but the fault status is logged instead of published to an MQTT
  # diagnostic entity (which does not exist in this profile).

  - id: sleep_after_display
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(display_safe_to_sleep);'
          then:
            - script.execute: enter_deep_sleep
          else:
            - deep_sleep.prevent: deep_sleep_control
            - logger.log:
                level: ERROR
                format: "E-paper remains BUSY; starting bounded recovery"
            - script.execute: recover_display_busy
